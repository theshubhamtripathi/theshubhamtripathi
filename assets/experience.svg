=".35"/><text x="196.6" y="320.0" text-anchor="middle" class="mono a2" font-size="11">Spring Boot</text></g><g class="fu" style="animation-delay:1.42s"><rect x="253.1" y="304" width="110.7" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="308.4" y="320.0" text-anchor="middle" class="mono a2" font-size="11">MS SQL Server</text></g><g class="fu" style="animation-delay:1.48s"><rect x="371.8" y="304" width="103.8" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="423.7" y="320.0" text-anchor="middle" class="mono a2" font-size="11">Entra ID SSO</text></g><g class="fu" style="animation-delay:1.54s"><rect x="483.6" y="304" width="131.1" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="549.2" y="320.0" text-anchor="middle" class="mono a2" font-size="11">OAuth 2.0 / OIDC</text></g><g class="fu" style="animation-delay:1.60s"><rect x="622.7" y="304" width="124.3" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="684.9" y="320.0" text-anchor="middle" class="mono a2" font-size="11">Spring Security</text></g><g class="fu" style="animation-delay:1.66s"><rect x="755.0" y="304" width="42.5" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="776.3" y="320.0" text-anchor="middle" class="mono a2" font-size="11">JWT</text></g><g class="fu" style="animation-delay:1.72s"><rect x="84.0" y="336" width="69.7" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="118.9" y="352.0" text-anchor="middle" class="mono a2" font-size="11">OpenAPI</text></g><g class="fu" style="animation-delay:1.78s"><rect x="161.7" y="336" width="124.3" height="24" rx="12.0" fill="#0E3B2E" stroke="#16C68E" stroke-opacity=".35"/><text x="223.9" y="352.0" text-anchor="middle" class="mono a2" font-size="11">JUnit · Mockito</text></g>
