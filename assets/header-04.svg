<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" fill="none" role="img" aria-label="04 Tech Stack">
<title>04 Tech Stack</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Ubuntu,'Helvetica Neue',Arial,sans-serif}
.w{fill:#FFFFFF} .t{fill:#E6EDF3} .m{fill:#8B949E} .a{fill:#16C68E} .a2{fill:#5EF2C0}
.b{font-weight:700} .sb{font-weight:600}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .8s ease both}
.si{animation:slideIn .7s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(940px)}}
.sweep{animation:sweep 4.5s cubic-bezier(.6,0,.4,1) 1.2s infinite}
.chip{animation:pulse 2.8s ease-in-out infinite}
</style>
<defs>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#16C68E"/><stop offset=".55" stop-color="#16C68E" stop-opacity=".35"/><stop offset="1" stop-color="#16C68E" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#5EF2C0" stop-opacity="0"/><stop offset=".5" stop-color="#5EF2C0"/><stop offset="1" stop-color="#5EF2C0" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="lc"><rect x="0" y="60" width="900" height="4"/></clipPath>
</defs>
<g class="fi">
  <rect x="1" y="12" width="58" height="36" rx="9" fill="#0E3B2E"/>
  <rect class="chip" x="1" y="12" width="58" height="36" rx="9" stroke="#16C68E" filter="url(#glow)"/>
  <text x="30" y="36" text-anchor="middle" class="mono a2 b" font-size="16">04</text>
</g>
<text x="78" y="40" class="sans w b si" font-size="26" style="animation-delay:.15s">Tech Stack</text>
<text x="898" y="39" text-anchor="end" class="mono m fi" font-size="13" style="animation-delay:.5s">// tools of the trade</text>
<rect x="0" y="61" width="900" height="1" fill="#1F2A26"/>
<rect x="0" y="61" width="900" height="2" fill="url(#line)">
  <animate attributeName="width" values="0;900" dur="1.2s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>
</rect>
<g clip-path="url(#lc)"><rect class="sweep" x="0" y="60" width="140" height="4" fill="url(#shine)"/></g>
</svg>
